[project]
name = "resume-screening-llm"
version = "0.1.0"
description = "AI-powered resume parsing and candidate screening with Groq"
readme = "README.md"
authors = [
    { name = "akshat-create", email = "akshatpandey9198@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
